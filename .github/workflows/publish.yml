# Build and publish switch-trust-mcp to PyPI on a release tag.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored. The trusted
# publisher for the `switch-trust-mcp` project on PyPI points at this repo,
# workflow `publish.yml`, environment `pypi`.
#
# ## What is allowed to reach PyPI
#
# This repo is public and has ~80 collaborators, so "a tag was pushed" is not on
# its own evidence that a release was intended. Three independent controls stand
# between a tag and an upload, two of them outside this file (repository
# settings, which a pull request cannot change):
#
#  1. A repository ruleset restricts creation, update and deletion of
#     `refs/tags/v*` to the release automation's deploy key. No collaborator,
#     including admins, can create a version tag by hand.
#  2. The `pypi` environment restricts deployments to `v*` tags and requires a
#     human reviewer to approve each one. A PyPI version can never be reused, so
#     this is the last reversible point in the pipeline.
#  3. The `verify` job below re-establishes, in the open, what the release
#     automation is supposed to have produced: a strict version tag, annotated
#     and signed by a key in `.github/release-signers`, on a commit that is an
#     ancestor of `main`, matching the version in `pyproject.toml`.
#
# The verify job reads its own trust anchor (`.github/release-signers`) out of
# the tagged tree, so it is defence in depth rather than a root of trust —
# whoever can create an arbitrary tag also controls that file. Control 1 is what
# makes creating such a tag impossible; this job is what makes a tag cut outside
# the intended path, or a mis-cut one, fail loudly and before the upload.
#
# There is deliberately no `workflow_dispatch`: every published artifact must
# correspond to a signed tag. Build and test coverage for non-release commits
# lives in `ci.yml`, and the release automation build-tests the tree before it
# ever cuts a tag.
#
# ## What is known about the artifact that reaches PyPI
#
# `audit` runs the whole release audit against the tagged commit — tests, a
# lockfile-freshness check, licences, SBOM, dependency vulnerabilities and a
# secret scan of both the tree and its history — and retains the reports as a
# build artifact, so there is evidence tied to this exact commit rather than to
# a tree that was audited somewhere upstream beforehand.
#
# `build` records a SHA256SUMS over the distributions and exposes its digest as
# a job output; `publish` re-derives that digest from the artifact it downloaded
# and refuses to upload unless it matches. The job output is the point: it
# travels outside the artifact, so checking SHA256SUMS against itself — which
# would prove nothing — is not what happens. `build` also attaches a signed
# provenance attestation binding the distributions to this commit and run, on
# top of the PEP 740 attestations PyPI receives at upload.
#
# Every action is pinned to a full commit SHA with the version in a trailing
# comment — a moved tag or a compromised upstream release must not be able to
# change what gets published without a commit here. Renovate
# (`renovate.json5`, github-actions manager, pinDigests) updates the SHA and the
# comment together; never replace a SHA with a tag. `actions/checkout` and
# `actions/setup-python` are held at the same SHAs as `ci.yml` so the build here
# matches the one that gets tested on every PR.
name: publish

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

# Never let two releases race to the same PyPI project; queue instead.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    name: verify release provenance
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.provenance.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag provenance
        id: provenance
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # A release tag, not just any tag the trigger glob happens to match.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'; then
            echo "::error::'$TAG' is not a release version tag"
            exit 1
          fi

          # Annotated and signed. A lightweight tag carries no signature and no
          # tagger, so there is nothing to attribute it to.
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "::error::'$TAG' is a lightweight tag; releases are signed annotated tags"
            exit 1
          fi
          if ! git -c gpg.format=ssh \
                   -c gpg.ssh.allowedSignersFile=.github/release-signers \
                   verify-tag "refs/tags/$TAG"; then
            echo "::error::'$TAG' is not signed by a key in .github/release-signers"
            exit 1
          fi

          # Branch provenance: the tagged commit must be reachable from `main`,
          # which is pull-request protected. A tag on a side branch, on a
          # rewritten history, or on a commit that never landed is not a release.
          #
          # Do not re-fetch since token is removed due to persist-credentials: false
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main is missing from the checkout; cannot establish branch provenance"
            exit 1
          fi
          SHA="$(git rev-list -n 1 "refs/tags/$TAG")"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::commit $SHA is not an ancestor of main"
            exit 1
          fi

          # The artifact PyPI receives is named by pyproject.toml, not by the
          # tag; if they disagree the tag is not describing what gets published.
          PACKAGE_VERSION="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "${TAG#v}" != "$PACKAGE_VERSION" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $PACKAGE_VERSION"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Verified $TAG -> $SHA (signed, on main, version $PACKAGE_VERSION)"

  audit:
    name: release audit
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify.outputs.sha }}
          # The secret scan covers git history, not just the tree.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install the package and the audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,audit]'
      - name: Install gitleaks
        # Pinned by version *and* checksum, and deliberately not
        # gitleaks/gitleaks-action, which requires a paid licence key for
        # organisation-owned repositories.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks
      - name: Tests
        run: python -m pytest -q
      - name: Verify the lockfile matches pyproject.toml
        # Same check the release automation runs before pushing here. A stale
        # lockfile means the vulnerability scan below audits the wrong set.
        run: |
          set -euo pipefail
          cp requirements.lock requirements.lock.released
          pip-compile --strip-extras --quiet --output-file=requirements.lock pyproject.toml
          if ! diff -u requirements.lock.released requirements.lock; then
            echo "::error::requirements.lock is stale — regenerate it upstream"
            exit 1
          fi
          rm requirements.lock.released
      - name: Release audit (licences, SBOM, vulnerabilities, secrets)
        # The vulnerability gate is pointed at the shipped runtime closure rather
        # than this virtualenv: a CVE in pip-licenses or another dev-only tool is
        # worth knowing about but must not block a release of code that does not
        # ship it.
        run: make release-audit AUDIT_TARGET="--requirement requirements.lock"
      - name: Record what was audited
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo "tag:    $TAG"
            echo "commit: $SHA"
            echo "run:    $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > release/audited.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-audit-${{ github.ref_name }}
          path: release/
          retention-days: 90

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation signing
      attestations: write
    outputs:
      checksums: ${{ steps.digest.outputs.checksums }}
    steps:
      # The verified commit, not the tag: the tag cannot move between jobs
      # (the ruleset forbids updating it), but building the resolved SHA makes
      # what was checked and what was built the same object by construction.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Record artifact digests
        id: digest
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz *.whl > SHA256SUMS
          cat SHA256SUMS
          # Carried out of this job as a job output — i.e. outside the artifact
          # the publish job downloads — so that job has something independent to
          # compare against.
          echo "checksums=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz,dist/*.whl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    # The audit is a gate, not a report: nothing is uploaded unless it passed
    # against this exact commit.
    needs: [build, audit]
    runs-on: ubuntu-latest
    # Restricted to `v*` tags and gated on reviewer approval; see the header.
    environment: pypi
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Verify the artifact is the one that was built
        env:
          EXPECTED: ${{ needs.build.outputs.checksums }}
        run: |
          set -euo pipefail
          cd dist
          # Two links in one chain: SHA256SUMS is the file the build job signed
          # off on (its digest came through a job output, not through the
          # artifact), and -c proves every distribution still matches it.
          actual="$(sha256sum SHA256SUMS | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::SHA256SUMS digest $actual does not match $EXPECTED from the build job"
            exit 1
          fi
          sha256sum -c SHA256SUMS
          # Not a distribution; twine would reject the upload.
          rm SHA256SUMS
          ls -l
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
