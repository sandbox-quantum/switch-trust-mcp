name: CI

# Lightweight validating CI: install the package (with dev extras) and run the
# hermetic pytest suite (httpx MockTransport + fake client, no network). Added
# alongside the security rollout because the repo had no PR/push build-test CI
# (publish.yml only builds+publishes on version tags). Action SHAs are pinned;
# Renovate keeps them refreshed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build (python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
